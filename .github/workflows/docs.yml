# Dựng và triển khai lên GitHub Pages: trang tài liệu ở gốc, bản demo ứng dụng ở /app/. Cần: Settings → Pages → Source = "GitHub Actions".
name: Docs site
on:
  push:
    branches: [main]
    paths: ['docs/**', '*.md', 'scripts/docs-site/**', 'packages/**', 'apps/**', 'locales/**', 'presets/**', 'package-lock.json', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 26, cache: npm }
      - run: npm ci
      - name: Dựng site (repoUrl lấy từ repo hiện tại)
        run: DOCS_REPO_URL="https://github.com/${{ github.repository }}" DOCS_BRANCH="${{ github.ref_name }}" npm run docs:site
      # Bản demo ứng dụng (cùng CSP như bản build thường); base theo tên repo để phông, Worker và dự án mẫu tìm đúng đường dẫn.
      - name: Dựng bản demo ứng dụng vào /app/
        run: |
          DAWVIZ_BASE="/${{ github.event.repository.name }}/app/" npm run build
          mkdir -p dist-docs/app
          cp -r apps/web/dist/. dist-docs/app/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: { path: dist-docs, include-hidden-files: true }  # giữ .nojekyll (bản mới mặc định bỏ tệp ẩn)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
