name: Kết quả thử xuất video (Spike 1)
description: Gửi kết quả bạn thử xuất video trên máy của bạn
labels: [spike-1, test-result]
body:
  - type: markdown
    attributes:
      value: |
        Làm theo [trang "Thử nghiệm xuất video"](https://dawviz.github.io/dawviz/) trong Hướng dẫn sử dụng rồi điền kết quả. Issue này công khai: không đính kèm tệp nhạc bạn không muốn chia sẻ.
  - type: textarea
    id: report
    attributes:
      label: Kết quả "Kiểm tra máy này" (dán nguyên văn)
      description: Mở Xuất video → Kiểm tra máy này → Chép kết quả.
      render: text
    validations: { required: true }
  - type: dropdown
    id: format
    attributes:
      label: Định dạng ứng dụng đã chọn khi xuất
      options: [MP4 H.264 + AAC, MP4 H.264 không tiếng, WebM VP9/VP8, Không xuất được]
    validations: { required: true }
  - type: dropdown
    id: result
    attributes:
      label: Xuất có xong không?
      options: [Xong, tệp phát được, Xong nhưng tệp không phát / hỏng, Dừng giữa chừng hoặc báo lỗi, Treo hoặc rất chậm]
    validations: { required: true }
  - type: dropdown
    id: sync
    attributes:
      label: Tiếng và hình có khớp không? (chỉ khi bạn nạp âm thanh)
      description: Nghe nốt/tiếng đầu tiên so với hình nốt đầu tiên trong video đã xuất.
      options: [Khớp, Lệch rõ (tiếng sớm), Lệch rõ (tiếng trễ), Không thử]
    validations: { required: true }
  - type: input
    id: speed
    attributes:
      label: Thời gian xuất và độ dài video (nếu nhớ)
      placeholder: 7 giây cho video 1 phút 53 giây, 720p 24fps
  - type: input
    id: device
    attributes:
      label: Máy (CPU/GPU, hoặc tên điện thoại)
  - type: textarea
    id: notes
    attributes:
      label: Ghi chú thêm
