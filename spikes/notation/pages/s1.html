<style>body{margin:0;background:#fff}canvas{display:block}</style>
<canvas id="a"></canvas><canvas id="b"></canvas><canvas id="d"></canvas>
<script type="module">
import * as VF from 'vexflow';
import { drawSample } from '/lib/sampleScore.mjs';
import { makePathCache, drawLayout } from '/lib/player.mjs';
await Promise.all(['Bravura','Academico'].map(f => document.fonts.load(`30pt ${f}`)));
await document.fonts.ready;
const layout = await (await fetch('/out/s1-layout.json')).json();
const { width: W, height: H } = layout.size;
const A = document.getElementById('a'), B = document.getElementById('b'), D = document.getElementById('d');
for (const c of [A,B,D]) { c.width = W; c.height = H; }
const t0 = performance.now();
const r = new VF.Renderer(A, VF.Renderer.Backends.CANVAS); r.resize(W, H);
drawSample(VF, r.getContext());
const t1 = performance.now();
const cb = B.getContext('2d'); const cache = makePathCache();
drawLayout(cb, layout, cache);
const t2 = performance.now();
const a = A.getContext('2d').getImageData(0,0,W,H).data, b = cb.getImageData(0,0,W,H).data;
const dctx = D.getContext('2d'); const out = dctx.createImageData(W,H);
let inkA=0, inkB=0, both=0, diff=0;
for (let i=3;i<a.length;i+=4){ const x=a[i]>96, y=b[i]>96; inkA+=x; inkB+=y; both+=(x&&y); if (Math.abs(a[i]-b[i])>128){diff++; out.data[i-3]= x?255:0; out.data[i-1]= y?255:0; out.data[i]=255;} }
dctx.putImageData(out,0,0);
window.__result = { W, H, refMs:+(t1-t0).toFixed(1), playerMs:+(t2-t1).toFixed(1), inkA, inkB, iou:+(both/(inkA+inkB-both)).toFixed(4), diffPx: diff };
</script>
